<script src="/lens-auth.js"></script>
<title>Equipment booking</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b1f3a'/%3E%3Ctext x='50' y='70' font-size='56' font-family='Georgia,serif' fill='%23fff' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    --font-m:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --bg:#f5f7fa;--surface:#fff;--surface-2:#eef1f5;--line:#dce2ea;--ink:#16202e;--muted:#5b6778;
    --accent:#1e4f8a;--hero-bg:#0b1f3a;--hero-fg:#eaf0fa;--hero-dim:#9db1d6;--hero-accent:#5ea0ff;--hero-gold:#d8a24a;--hero-line:#6f86b6;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--surface:#151d2b;--surface-2:#1c2636;--line:#283347;--ink:#e7edf5;--muted:#93a1b5;--accent:#5ea0ff;}}
  :root[data-theme="dark"]{--bg:#0e1420;--surface:#151d2b;--surface-2:#1c2636;--line:#283347;--ink:#e7edf5;--muted:#93a1b5;--accent:#5ea0ff;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
  a{color:var(--accent)}
  .hero{background:var(--hero-bg);color:var(--hero-fg);padding:22px 20px 20px}
  .hwrap{max-width:1180px;margin:0 auto}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .lock{font-weight:800;letter-spacing:.16em;font-size:17px}
  .lock span{font-weight:400;letter-spacing:.02em;color:var(--hero-dim);font-size:12.5px;font-family:var(--font-m);margin-left:8px}
  h1{margin:14px 0 4px;font-size:25px;letter-spacing:.2px}
  h1 small{font-weight:400;color:var(--hero-dim);font-size:16px}
  .labnote{color:var(--hero-dim);font-size:12.5px;font-family:var(--font-m);margin-top:2px}
  #lens-userchip{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-m);font-size:11.5px;letter-spacing:.03em;color:var(--hero-dim);border:1px solid rgba(157,177,214,.3);border-radius:20px;padding:5px 13px;margin-top:14px}
  #lens-userchip:empty{display:none}
  #lens-userchip a{color:var(--hero-fg);cursor:pointer;text-decoration:underline;text-underline-offset:2px;opacity:.9}
  .tgl{width:40px;height:40px;border:1px solid rgba(157,177,214,.35);border-radius:10px;background:transparent;color:var(--hero-fg);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
  main{max-width:1180px;margin:0 auto;padding:16px 20px 60px}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .nav{display:flex;align-items:center;gap:4px}
  button{font-family:inherit;font-size:14px}
  .btn{padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn-primary{padding:8px 14px;border:0;border-radius:9px;background:var(--accent);color:#fff;cursor:pointer;font-weight:600}
  .wklabel{font-weight:700;font-size:16px;min-width:210px;text-align:center}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border:1px solid var(--line);border-radius:20px;background:var(--surface);cursor:pointer;font-size:13px;color:var(--muted);user-select:none}
  .chip .dot{width:10px;height:10px;border-radius:3px;flex:none}
  .chip.on{color:var(--ink);border-color:var(--accent);background:var(--surface-2)}
  .chip.off .dot{opacity:.3}
  .spacer{flex:1}
  .gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
  .grid{display:grid;grid-template-columns:52px repeat(7,minmax(118px,1fr));min-width:880px}
  .ghead{position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 4px;text-align:center;font-size:12.5px}
  .ghead .dn{font-weight:700}.ghead .dd{color:var(--muted);font-size:11.5px}
  .ghead.today{background:var(--surface-2)}
  .ghead.today .dn{color:var(--accent)}
  .tgutter{grid-column:1}
  .tlabel{height:44px;font-size:10.5px;color:var(--muted);text-align:right;padding-right:6px;position:relative;top:-6px;font-family:var(--font-m)}
  .daycol{position:relative;border-left:1px solid var(--line)}
  .daycol .hour{height:44px;border-bottom:1px dashed var(--line)}
  .daycol .half{height:22px;border-bottom:1px dotted transparent}
  .bk{position:absolute;border-radius:6px;padding:3px 5px;color:#fff;font-size:11px;line-height:1.25;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .bk b{font-weight:700}
  .bk .who{opacity:.9;font-size:10px}
  .bk.mine{outline:2px solid rgba(255,255,255,.65);outline-offset:-2px}
  .empty{padding:40px 16px;text-align:center;color:var(--muted)}
  /* modal */
  .ovl{position:fixed;inset:0;z-index:50;background:rgba(10,20,35,.5);display:flex;align-items:center;justify-content:center;padding:16px}
  .ovl[hidden]{display:none}
  .modal{width:100%;max-width:440px;background:var(--surface);border-radius:14px;padding:20px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 14px;font-size:18px}
  .modal label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;font-weight:600}
  .modal input,.modal select,.modal textarea{width:100%;padding:9px 10px;font-size:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-family:inherit}
  .modal input[readonly]{background:var(--surface-2);color:var(--muted)}
  .row2{display:flex;gap:10px}.row2>div{flex:1}
  .mbtns{display:flex;gap:8px;margin-top:18px;align-items:center}
  .merr{color:#c0392b;font-size:13px;min-height:18px;margin-top:10px}
  .del{margin-left:auto;background:none;border:0;color:#c0392b;cursor:pointer;text-decoration:underline;font-size:13px}
  .eqrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .eqrow input[type=text]{width:auto;flex:1;min-width:120px}
  .eqrow input[type=color]{width:38px;height:34px;padding:2px}
  .trainbox{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px;font-size:13px}
  .trainbox label{display:inline-flex;align-items:center;gap:4px;color:var(--ink);margin:0;font-weight:400}
  .muted{color:var(--muted);font-size:12.5px}
  @media(max-width:560px){h1{font-size:21px}main{padding:12px}}
</style>

<div class="hero">
  <div class="hwrap">
    <div class="topbar">
      <div class="lock">LENS <span>Light–Energy Nanophotonics &amp; Semiconductors</span></div>
      <button class="tgl" id="tgl" title="Toggle theme" aria-label="Toggle theme"></button>
    </div>
    <h1>Equipment booking <small>设备预约</small></h1>
    <div class="labnote">Times are lab-local · Guangzhou (UTC+8)</div>
    <span id="lens-userchip"></span>
  </div>
</div>

<main>
  <div class="toolbar">
    <div class="nav">
      <button class="btn" id="prev" title="Previous week">‹</button>
      <button class="btn" id="today">Today 今天</button>
      <button class="btn" id="next" title="Next week">›</button>
    </div>
    <div class="wklabel" id="wklabel">—</div>
    <button class="btn-primary" id="newbk">＋ New booking 预约</button>
    <div class="spacer"></div>
    <button class="btn" id="exportbtn" title="Download bookings as CSV">Export CSV</button>
    <button class="btn" id="manage" hidden>Manage instruments 设备管理</button>
  </div>

  <div class="chips" id="chips" style="margin-bottom:12px"></div>

  <div class="gridwrap">
    <div class="grid" id="grid"></div>
  </div>
  <div class="muted" id="status" style="margin-top:10px"></div>
</main>

<!-- booking modal -->
<div class="ovl" id="bkovl" hidden>
  <div class="modal">
    <h3 id="bktitle">New booking</h3>
    <label>Instrument 仪器</label>
    <select id="bk_eq"></select>
    <label>Date 日期</label>
    <input type="date" id="bk_date">
    <div class="row2">
      <div><label>Start 开始</label><select id="bk_s"></select></div>
      <div><label>End 结束</label><select id="bk_e"></select></div>
    </div>
    <label>Note 备注 <span class="muted">— optional (sample, process…)</span></label>
    <input type="text" id="bk_note" placeholder="e.g. PbI2 evaporation, 3 samples">
    <label>Booked by 预约人</label>
    <input type="text" id="bk_by" readonly>
    <div class="merr" id="bk_err"></div>
    <div class="mbtns">
      <button class="btn-primary" id="bk_save">Save 保存</button>
      <button class="btn" id="bk_cancel">Cancel</button>
      <button class="del" id="bk_del" hidden>Cancel this booking 取消预约</button>
    </div>
  </div>
</div>

<!-- admin manage modal -->
<div class="ovl" id="mgovl" hidden>
  <div class="modal" style="max-width:560px">
    <h3>Manage instruments 设备管理</h3>
    <div class="muted" style="margin-bottom:6px">Edit names, colour, who's trained (ticked members can book it). Admins can always book.</div>
    <div id="eqlist"></div>
    <div style="margin-top:14px"><button class="btn" id="eqadd">＋ Add instrument</button></div>
    <div class="mbtns"><button class="btn" id="mg_close">Close</button></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};

  /* ---- endpoints (same Worker, two addresses; pick whichever the network can reach) ---- */
  var API_BASES=["https://api.lens-laboratory.com","https://lens-inventory-api.lens-laboratory.workers.dev"];
  var API_BASE=(function(){try{return localStorage.getItem("lens_apibase")||API_BASES[0];}catch(e){return API_BASES[0];}})();
  function probeBase(b){return new Promise(function(res){var c=(typeof AbortController!=="undefined")?new AbortController():null;var t=setTimeout(function(){if(c)try{c.abort();}catch(e){}res(false);},3500);fetch(b+"/api/calversion",c?{method:"GET",signal:c.signal}:{method:"GET"}).then(function(){clearTimeout(t);res(true);}).catch(function(){clearTimeout(t);res(false);});});}
  function pickApiBase(cb){(function go(i){if(i>=API_BASES.length){if(cb)cb();return;}probeBase(API_BASES[i]).then(function(ok){if(ok){API_BASE=API_BASES[i];try{localStorage.setItem("lens_apibase",API_BASE);}catch(e){}if(cb)cb();}else go(i+1);});})(0);}
  function tok(){try{return (window.LENS&&LENS.token())||"";}catch(e){return "";}}
  function isAdmin(){try{return !!(window.LENS&&LENS.isAdmin());}catch(e){return false;}}
  function myName(){try{var u=window.LENS&&LENS.user();return u?(u.name||u.username):"";}catch(e){return "";}}
  function myUser(){try{var u=window.LENS&&LENS.user();return u?u.username:"";}catch(e){return "";}}
  function hdr(){return {"Content-Type":"application/json","X-LENS-Token":tok()};}
  function api(path,opts){opts=opts||{};opts.headers=hdr();return fetch(API_BASE+path,opts).then(function(r){if(r.status===401){try{LENS.logout();}catch(e){}throw new Error("unauthorized");}return r;});}

  /* ---- lab-local date helpers (Asia/Shanghai, fixed UTC+8, no DST) ---- */
  var LAB_TZ="Asia/Shanghai";
  function todayLab(){return new Date().toLocaleDateString("en-CA",{timeZone:LAB_TZ});}
  function pedate(s){return new Date(s+"T12:00:00Z");}
  function fmtd(d){return d.toISOString().slice(0,10);}
  function addDays(s,n){var d=pedate(s);d.setUTCDate(d.getUTCDate()+n);return fmtd(d);}
  function mondayOf(s){var d=pedate(s);var dow=d.getUTCDay();var off=(dow===0?-6:1-dow);return addDays(s,off);}
  function weekDates(start){var a=[];for(var i=0;i<7;i++)a.push(addDays(start,i));return a;}
  var DOW=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  function dayNum(s){return pedate(s).getUTCDate();}
  function monLabel(s){return pedate(s).toLocaleDateString("en-US",{month:"short"});}

  /* ---- time grid ---- */
  var DAY_START=7*60, DAY_END=23*60, ROW=22; // px per 30 min
  function mToHHMM(m){var h=Math.floor(m/60),mm=m%60;return (h<10?"0":"")+h+":"+(mm<10?"0":"")+mm;}
  function fillTimeSelect(sel,lo,hi,val){sel.innerHTML="";for(var m=lo;m<=hi;m+=30){var o=document.createElement("option");o.value=m;o.textContent=mToHHMM(m);sel.appendChild(o);}if(val!=null)sel.value=val;}

  /* ---- state ---- */
  var EQUIP=[], BOOK=[], SHOW={}, weekStart=mondayOf(todayLab()), calVer=-1, USERS=[], editId=null;

  /* ---- theme ---- */
  var SUN='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>';
  var MOON='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5z"/></svg>';
  function curTheme(){try{return document.documentElement.getAttribute("data-theme")||(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");}catch(e){return "light";}}
  function setTheme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("lens_theme",t);}catch(e){}$("tgl").innerHTML=t==="dark"?SUN:MOON;}
  (function(){var t;try{t=localStorage.getItem("lens_theme");}catch(e){}setTheme(t||curTheme());})();
  $("tgl").addEventListener("click",function(){setTheme(curTheme()==="dark"?"light":"dark");});

  /* ---- data load ---- */
  function loadWeek(){
    var from=weekStart, to=addDays(weekStart,6);
    return Promise.all([
      api("/api/equipment").then(function(r){return r.json();}),
      api("/api/bookings?from="+from+"&to="+to).then(function(r){return r.json();})
    ]).then(function(res){
      EQUIP=(res[0].equipment||[]).filter(function(e){return e.active;});
      // default: show everything the first time
      if(Object.keys(SHOW).length===0)EQUIP.forEach(function(e){SHOW[e.id]=true;});
      BOOK=res[1].bookings||[];
      calVer=res[1].version;
      setStatus("");
      renderChips();renderGrid();
    }).catch(function(e){ if(String(e&&e.message)!=="unauthorized") setStatus("Can't reach the server — retrying…"); pickApiBase(function(){}); });
  }
  function poll(){api("/api/calversion").then(function(r){return r.json();}).then(function(j){if(j&&j.version!==calVer)loadWeek();}).catch(function(){});}

  function setStatus(s){$("status").textContent=s||"";}

  /* ---- chips ---- */
  function renderChips(){
    var html=EQUIP.map(function(e){
      return '<span class="chip '+(SHOW[e.id]?"on":"off")+'" data-id="'+e.id+'"><span class="dot" style="background:'+esc(e.color)+'"></span>'+esc(e.name)+(e.canBook?"":' 🔒')+'</span>';
    }).join("");
    html='<span class="chip" id="chip-all">All / none</span>'+html;
    $("chips").innerHTML=html;
    $("chip-all").addEventListener("click",function(){var anyOff=EQUIP.some(function(e){return !SHOW[e.id];});EQUIP.forEach(function(e){SHOW[e.id]=anyOff;});renderChips();renderGrid();});
    [].forEach.call($("chips").querySelectorAll(".chip[data-id]"),function(el){el.addEventListener("click",function(){var id=el.getAttribute("data-id");SHOW[id]=!SHOW[id];renderChips();renderGrid();});});
  }

  /* ---- grid ---- */
  function layoutLanes(list){ // assign side-by-side lanes to overlapping bookings
    list.sort(function(a,b){return a.s-b.s||a.e-b.e;});
    var lanes=[];
    list.forEach(function(bk){
      var placed=false;
      for(var i=0;i<lanes.length;i++){ if(lanes[i]<=bk.s){ bk._lane=i; lanes[i]=bk.e; placed=true; break; } }
      if(!placed){ bk._lane=lanes.length; lanes.push(bk.e); }
    });
    list.forEach(function(bk){ bk._lanes=lanes.length; });
    return list;
  }
  function renderGrid(){
    var days=weekDates(weekStart), today=todayLab();
    var eqById={}; EQUIP.forEach(function(e){eqById[e.id]=e;});
    var h='<div class="ghead" style="grid-column:1"></div>';
    days.forEach(function(d){
      h+='<div class="ghead'+(d===today?" today":"")+'"><div class="dn">'+DOW[days.indexOf(d)]+'</div><div class="dd">'+monLabel(d)+' '+dayNum(d)+'</div></div>';
    });
    // time gutter
    h+='<div class="tgutter" style="grid-column:1;grid-row:2">';
    for(var m=DAY_START;m<DAY_END;m+=60){h+='<div class="tlabel">'+mToHHMM(m)+'</div>';}
    h+='</div>';
    days.forEach(function(d,di){
      h+='<div class="daycol" data-day="'+d+'" style="grid-column:'+(di+2)+';grid-row:2">';
      for(var mm=DAY_START;mm<DAY_END;mm+=60){h+='<div class="hour"></div>';}
      // bookings for this day, among shown instruments
      var list=BOOK.filter(function(b){return b.date===d&&SHOW[b.equip]&&eqById[b.equip];}).map(function(b){return {s:b.s,e:b.e,b:b};});
      layoutLanes(list);
      list.forEach(function(it){
        var b=it.b, eq=eqById[b.equip];
        var top=(Math.max(b.s,DAY_START)-DAY_START)/30*ROW;
        var hgt=Math.max((Math.min(b.e,DAY_END)-Math.max(b.s,DAY_START))/30*ROW-2,16);
        var w=100/it._lanes, left=it._lane*w;
        var mine=b.username&&b.username===myUser();
        h+='<div class="bk'+(mine?" mine":"")+'" style="top:'+top+'px;height:'+hgt+'px;left:calc('+left+'% + 1px);width:calc('+w+'% - 2px);background:'+esc(eq.color)+'" data-bk="'+b.id+'" title="'+esc(eq.name)+' · '+mToHHMM(b.s)+'–'+mToHHMM(b.e)+' · '+esc(b.name)+(b.note?" · "+esc(b.note):"")+'">'+
          '<b>'+esc(eq.name)+'</b><div>'+mToHHMM(b.s)+'–'+mToHHMM(b.e)+'</div><div class="who">'+esc(b.name||"")+'</div></div>';
      });
      h+='</div>';
    });
    $("grid").innerHTML=h;
    var y1=pedate(days[0]), y2=pedate(days[6]);
    $("wklabel").textContent=monLabel(days[0])+" "+dayNum(days[0])+" – "+monLabel(days[6])+" "+dayNum(days[6])+", "+y2.getUTCFullYear();
    // wire day columns: click empty → new booking at that time
    [].forEach.call($("grid").querySelectorAll(".daycol"),function(col){
      col.addEventListener("click",function(ev){
        if(ev.target.closest(".bk"))return;
        var rect=col.getBoundingClientRect();
        var y=ev.clientY-rect.top;
        var m=DAY_START+Math.floor(y/ROW)*30; if(m<DAY_START)m=DAY_START; if(m>DAY_END-30)m=DAY_END-30;
        openBooking(null,{date:col.getAttribute("data-day"),s:m,e:Math.min(m+60,DAY_END)});
      });
    });
    [].forEach.call($("grid").querySelectorAll(".bk"),function(el){
      el.addEventListener("click",function(ev){ev.stopPropagation();var b=BOOK.filter(function(x){return x.id===el.getAttribute("data-bk");})[0];if(b)openBooking(b);});
    });
  }

  /* ---- booking modal ---- */
  function bookable(){return EQUIP.filter(function(e){return e.active&&(isAdmin()||e.canBook);});}
  function openBooking(b,pre){
    editId=b?b.id:null;
    var canList=bookable();
    if(!b && canList.length===0){alert("You're not marked trained on any instrument yet — ask an admin to enable you in Manage instruments.");return;}
    $("bktitle").textContent=b?"Edit booking":"New booking";
    // instrument options: when editing, include its equip even if not in bookable (admin)
    var opts=canList.slice();
    if(b && !opts.some(function(e){return e.id===b.equip;})){var eq=EQUIP.filter(function(e){return e.id===b.equip;})[0];if(eq)opts.unshift(eq);}
    $("bk_eq").innerHTML=opts.map(function(e){return '<option value="'+e.id+'">'+esc(e.name)+'</option>';}).join("");
    $("bk_eq").value=b?b.equip:(pre&&pre.equip)||opts[0].id;
    $("bk_date").value=b?b.date:(pre?pre.date:todayLab());
    var s=b?b.s:(pre?pre.s:9*60), e=b?b.e:(pre?pre.e:10*60);
    fillTimeSelect($("bk_s"),DAY_START,DAY_END-30,s);
    fillTimeSelect($("bk_e"),DAY_START+30,DAY_END,e);
    $("bk_note").value=b?(b.note||""):"";
    $("bk_by").value=b?(b.name||""):myName();
    $("bk_err").textContent="";
    $("bk_del").hidden=!(b&&(isAdmin()||b.username===myUser()));
    $("bkovl").hidden=false;
  }
  $("bk_s").addEventListener("change",function(){var s=parseInt($("bk_s").value,10);var e=parseInt($("bk_e").value,10);if(e<=s)fillTimeSelect($("bk_e"),DAY_START+30,DAY_END,Math.min(s+60,DAY_END));});
  $("bk_cancel").addEventListener("click",function(){$("bkovl").hidden=true;});
  $("newbk").addEventListener("click",function(){openBooking(null,{date:todayLab()});});
  $("bk_save").addEventListener("click",function(){
    var body={equip:$("bk_eq").value,date:$("bk_date").value,s:parseInt($("bk_s").value,10),e:parseInt($("bk_e").value,10),note:$("bk_note").value.trim()};
    if(editId)body.id=editId;
    if(body.e<=body.s){$("bk_err").textContent="End must be after start.";return;}
    $("bk_save").disabled=true;$("bk_err").textContent="Saving…";
    api("/api/booking",{method:"POST",body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});}).then(function(res){
      $("bk_save").disabled=false;
      if(!res.ok){$("bk_err").textContent=(res.j&&res.j.error)||"Could not save.";return;}
      $("bkovl").hidden=true;loadWeek();
    }).catch(function(){$("bk_save").disabled=false;$("bk_err").textContent="Network error — try again.";});
  });
  $("bk_del").addEventListener("click",function(){
    if(!editId)return;
    api("/api/booking?id="+encodeURIComponent(editId),{method:"DELETE"}).then(function(r){return r.json();}).then(function(){$("bkovl").hidden=true;loadWeek();}).catch(function(){$("bk_err").textContent="Could not cancel.";});
  });

  /* ---- week nav ---- */
  $("prev").addEventListener("click",function(){weekStart=addDays(weekStart,-7);renderGrid();loadWeek();});
  $("next").addEventListener("click",function(){weekStart=addDays(weekStart,7);renderGrid();loadWeek();});
  $("today").addEventListener("click",function(){weekStart=mondayOf(todayLab());renderGrid();loadWeek();});

  /* ---- CSV export (current week, shown instruments) ---- */
  $("exportbtn").addEventListener("click",function(){
    var eqById={};EQUIP.forEach(function(e){eqById[e.id]=e;});
    var rows=[["date","instrument","start","end","booked_by","note"]];
    BOOK.filter(function(b){return SHOW[b.equip];}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.s-b.s;}).forEach(function(b){
      rows.push([b.date,(eqById[b.equip]||{}).name||b.equip,mToHHMM(b.s),mToHHMM(b.e),b.name||"",b.note||""]);
    });
    var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="lens-bookings-"+weekStart+".csv";a.click();
  });

  /* ---- admin: manage instruments ---- */
  function openManage(){
    api("/api/users",{method:"GET"}).then(function(r){return r.ok?r.json():{users:[]};}).then(function(j){USERS=j.users||[];}).catch(function(){USERS=[];}).then(function(){renderEqList();$("mgovl").hidden=false;});
  }
  function renderEqList(){
    api("/api/equipment").then(function(r){return r.json();}).then(function(j){
      var eqs=j.equipment||[];
      $("eqlist").innerHTML=eqs.map(function(e,i){
        var trained=e.trained||[];
        var checks=USERS.map(function(u){return '<label><input type="checkbox" data-eq="'+e.id+'" value="'+esc(u.username)+'"'+(trained.indexOf(u.username)>=0?" checked":"")+'> '+esc(u.name)+'</label>';}).join("");
        return '<div class="eqrow" data-id="'+e.id+'">'+
          '<input type="color" value="'+esc(e.color||"#2d6cdf")+'" class="e_color">'+
          '<input type="text" class="e_name" value="'+esc(e.name)+'" placeholder="name">'+
          '<input type="text" class="e_zh" value="'+esc(e.name_zh||"")+'" placeholder="中文" style="max-width:110px">'+
          '<label style="margin:0"><input type="checkbox" class="e_active"'+(e.active?" checked":"")+'> active</label>'+
          '<button class="btn e_save">Save</button><button class="del e_del">delete</button>'+
          '<div class="trainbox" style="flex-basis:100%">'+(USERS.length?('Trained: '+checks):'<span class="muted">No member accounts yet — add them in the inventory\'s Accounts panel.</span>')+'</div>'+
          '</div>';
      }).join("")||'<div class="muted">No instruments.</div>';
      [].forEach.call($("eqlist").querySelectorAll(".eqrow"),function(row){
        var id=row.getAttribute("data-id");
        row.querySelector(".e_save").addEventListener("click",function(){saveEq(row,id,eqs);});
        row.querySelector(".e_del").addEventListener("click",function(){
          if(!confirm("Delete this instrument and all its bookings?"))return;
          api("/api/equipment?id="+encodeURIComponent(id),{method:"DELETE"}).then(function(){renderEqList();loadWeek();});
        });
      });
    });
  }
  function saveEq(row,id,eqs){
    var ex=eqs.filter(function(e){return e.id===id;})[0]||{};
    var trained=[].map.call(row.querySelectorAll('input[type=checkbox][data-eq]'),function(c){return c;}).filter(function(c){return c.checked;}).map(function(c){return c.value;});
    var body={id:id,name:row.querySelector(".e_name").value.trim(),name_zh:row.querySelector(".e_zh").value.trim(),color:row.querySelector(".e_color").value,active:row.querySelector(".e_active").checked?1:0,ord:ex.ord||0,trained:trained};
    if(!body.name){alert("Name required");return;}
    api("/api/equipment",{method:"POST",body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(){renderEqList();loadWeek();});
  }
  $("eqadd").addEventListener("click",function(){
    var name=prompt("New instrument name (English):","");if(!name)return;
    api("/api/equipment",{method:"POST",body:JSON.stringify({name:name.trim(),color:"#"+Math.floor(Math.random()*0x9fffff+0x400000).toString(16),ord:(EQUIP.length+1),active:1,trained:[]})}).then(function(){renderEqList();loadWeek();});
  });
  $("manage").addEventListener("click",openManage);
  $("mg_close").addEventListener("click",function(){$("mgovl").hidden=true;});
  [].forEach.call(document.querySelectorAll(".ovl"),function(o){o.addEventListener("click",function(ev){if(ev.target===o)o.hidden=true;});});

  /* ---- start (after sign-in) ---- */
  var started=false;
  function start(){
    if(started)return; started=true;
    $("manage").hidden=!isAdmin();
    $("bk_by").value=myName();
    pickApiBase(function(){ loadWeek(); setInterval(poll,25000); try{window.addEventListener("focus",poll);}catch(e){} });
  }
  document.addEventListener("lensauth",start);
  // if the gate already revealed before this script attached its listener
  if(window.LENS && LENS.token() && !document.getElementById("lens-gate")) start();
})();
</script>
